name: Test APWorld
on:
  push:
    branches: [ master, devel, ci ]
  pull_request:
    branches: [ master ]


jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: Eijebong/ap-actions/setup-ap@main
        with:
          version: '0.6.7'
          python-version: '3.13'

      - uses: actions/checkout@master
        with:
          path: 'archipelago/worlds/pokemon_hgss'

      - name: Make apworld
        shell: bash
        run: |
          cd archipelago/
          source .venv/bin/activate
          uv pip install pyparsing
          cd worlds/pokemon_hgss
          make pokemon_hgss.apworld
          cd ..
          zip pokemon_hgss/pokemon_hgss.apworld pokemon_hgss/archipelago.json

      - name: Copy apworld
        shell: bash
        run: cp archipelago/worlds/pokemon_hgss/pokemon_hgss.apworld .

      - name: Clean up Archipelago clone
        shell: bash
        run: rm -rf archipelago

      - uses: Eijebong/ap-actions/ap-tests@main
        with:
          apworld-path: pokemon_hgss.apworld
          ap-version: '0.6.7'
          python-version: '3.13'
          checkout: false


[common]
evo_item_shop = "event_goldenrod_store if !ap_items_shop_in_ap_helper"
cut = "hm01 & cut_badge & use_cut if hm_reader_mode == option_req_mon else hm01 & cut_badge & (use_cut | hm_reader)"
fly = "hm02 & fly_badge & use_fly if hm_reader_mode == option_req_mon else hm02 & fly_badge & (use_fly | hm_reader)"
surf = "hm03 & surf_badge & use_surf if hm_reader_mode == option_req_mon else hm03 & surf_badge & (use_surf | hm_reader)"
strength = "hm04 & strength_badge & use_strength if hm_reader_mode == option_req_mon else hm04 & strength_badge & (use_strength | hm_reader)"
whirlpool = "hm05 & whirlpool_badge & use_whirlpool if hm_reader_mode == option_req_mon else hm05 & whirlpool_badge & (use_whirlpool | hm_reader)"
rock_smash = "hm06 & rock_smash_badge & use_rock_smash if hm_reader_mode == option_req_mon else hm06 & rock_smash_badge & (use_rock_smash | hm_reader)"
waterfall = "hm07 & waterfall_badge & use_waterfall if hm_reader_mode == option_req_mon else hm07 & waterfall_badge & (use_waterfall | hm_reader)"
rock_climb = "hm08 & rock_climb_badge & use_rock_climb if hm_reader_mode == option_req_mon else hm08 & rock_climb_badge & (use_rock_climb | hm_reader)"
flash = "tm70 & use_flash if hm_reader_mode == option_req_mon & reusable_tms else tm70 & use_flash & evo_item_shop if hm_reader_mode == option_req_mon else tm70 & (use_flash | hm_reader) if reusable_tms else tm70 & (use_flash | hm_reader) & evo_item_shop"
